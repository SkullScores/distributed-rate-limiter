services:
  redis:
    image: redis:7-alpine

  app1:
    build: .
    environment:
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8080"
    depends_on: [redis]

  app2:
    build: .
    environment:
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8082:8080"
    depends_on: [redis]
